<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Condo - Roblox</title>
    <link rel="icon" type="image/png" sizes="512x512" href="https://upload.wikimedia.org/wikipedia/commons/7/70/Roblox_Corporation_2025_logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rbx-bg: #111214;
            --rbx-nav: #191b1f;
            --rbx-card: #1e2024;
            --rbx-card-hover: #27292e;
            --rbx-border: rgba(255, 255, 255, 0.08);
            --rbx-green: #00b06f;
            --rbx-green-hover: #00c47c;
            --rbx-text: #ffffff;
            --rbx-subtext: #bdbebe;
            --rbx-muted: #848688;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--rbx-bg);
            color: var(--rbx-text);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        a { color: inherit; text-decoration: none; }

        /* Top Roblox Navigation */
        .rbx-navbar {
            background: var(--rbx-nav);
            border-bottom: 1px solid var(--rbx-border);
            height: 56px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .rbx-nav-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .rbx-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.5px;
        }
        .rbx-logo-tilt {
            width: 26px; height: 26px;
            border: 5px solid #fff;
            border-radius: 4px;
            transform: rotate(14deg);
            display: inline-block;
            position: relative;
        }
        .rbx-logo-tilt::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--rbx-nav);
        }
        .rbx-nav-links {
            display: none;
            gap: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--rbx-subtext);
        }
        @media (min-width: 768px) { .rbx-nav-links { display: flex; } }
        .rbx-nav-links span.active {
            color: #fff;
            position: relative;
        }
        .rbx-nav-links span.active::after {
            content: '';
            position: absolute;
            bottom: -17px; left: 0; right: 0;
            height: 3px;
            background: #fff;
            border-radius: 2px;
        }

        .rbx-search {
            flex-grow: 1;
            max-width: 380px;
            position: relative;
        }
        .rbx-search input {
            width: 100%;
            background: #111214;
            border: 1px solid var(--rbx-border);
            border-radius: 8px;
            padding: 7px 14px 7px 36px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .rbx-search input:focus { border-color: rgba(255, 255, 255, 0.35); }
        .rbx-search i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--rbx-muted);
            font-size: 13px;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* Category Filter Pills */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .pill-group {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-pill {
            background: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            color: var(--rbx-subtext);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .filter-pill:hover { background: var(--rbx-card-hover); color: #fff; }
        .filter-pill.active {
            background: #fff;
            color: #111214;
            border-color: #fff;
        }

        /* Game Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        @media (min-width: 640px) { .games-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media (min-width: 1024px) { .games-grid { grid-template-columns: repeat(4, 1fr); gap: 22px; } }

        .game-tile {
            background: var(--rbx-card);
            border: 1px solid var(--rbx-border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
            cursor: pointer;
        }
        .game-tile:hover {
            transform: translateY(-4px);
            background: var(--rbx-card-hover);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
        }
        .tile-thumb {
            position: relative;
            aspect-ratio: 16 / 10;
            background: #0d0e10;
            overflow: hidden;
        }
        .tile-thumb img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s ease;
        }
        .game-tile:hover .tile-thumb img { transform: scale(1.04); }
        .vip-badge {
            position: absolute;
            bottom: 8px; left: 8px;
            background: rgba(0, 176, 111, 0.92);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 5px;
            letter-spacing: 0.3px;
        }
        .tile-body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .tile-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tile-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.78rem;
            color: var(--rbx-subtext);
            margin-bottom: 12px;
        }
        .rbx-play-btn {
            width: 100%;
            background: var(--rbx-green);
            color: #fff;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 9px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: auto;
            transition: background 0.15s ease;
        }
        .rbx-play-btn:hover { background: var(--rbx-green-hover); }

        /* Game Details Sheet */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(5px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }

        .details-sheet {
            background: var(--rbx-nav);
            border: 1px solid var(--rbx-border);
            border-radius: 16px;
            width: 100%;
            max-width: 680px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
            animation: popUp 0.2s ease-out;
        }
        @keyframes popUp { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

        .sheet-banner {
            position: relative;
            height: 220px;
            background: #0d0e10;
        }
        .sheet-banner img { width: 100%; height: 100%; object-fit: cover; }
        .sheet-close {
            position: absolute;
            top: 14px; right: 14px;
            width: 34px; height: 34px;
            background: rgba(17, 18, 20, 0.85);
            border-radius: 50%;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 15px;
        }
        .sheet-close:hover { background: #ef4444; }
        .sheet-content { padding: 22px 24px; }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--rbx-bg);
            padding: 12px;
            border-radius: 10px;
            margin: 16px 0;
            text-align: center;
        }
        .meta-label { font-size: 0.72rem; color: var(--rbx-muted); }
        .meta-value { font-size: 0.9rem; font-weight: 700; margin-top: 2px; }

        /* Full Authentic Google Chrome Window Modal (Fake Tab + Fake URL Bar) */
        .browser-modal-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }
        .browser-modal-overlay.active { display: flex; }
        .chrome-window {
            width: 100%;
            max-width: 1050px;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            font-family: system-ui, -apple-system, sans-serif;
            position: relative;
        }
        @media(min-width: 768px) {
            .chrome-window { border-radius: 8px; height: 84vh; width: 92vw; }
            .browser-modal-overlay { padding: 20px; }
        }
        .chrome-titlebar {
            background: #dee1e6;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            flex-shrink: 0;
        }
        .chrome-tabs {
            display: flex;
            height: 30px;
            margin-top: 6px;
        }
        .chrome-tab {
            background: #ffffff;
            border-radius: 6px 6px 0 0;
            padding: 0 10px;
            min-width: 130px;
            max-width: 210px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .chrome-tab-icon { width: 14px; height: 14px; margin-right: 7px; }
        .chrome-tab-title {
            font-size: 11px;
            color: #333;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .chrome-tab-close {
            font-size: 14px;
            color: #5f6368;
            cursor: pointer;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-left: 4px;
        }
        .chrome-tab-close:hover { background: #e8eaed; }
        .chrome-window-controls { display: flex; }
        .chrome-window-controls span {
            width: 34px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #333;
            cursor: pointer;
        }
        .chrome-window-controls .chrome-close-btn:hover { background: #e81123; color: white; }
        .chrome-toolbar {
            background: #ffffff;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            border-bottom: 1px solid #dadce0;
            gap: 6px;
            flex-shrink: 0;
        }
        .chrome-nav-btns { display: flex; gap: 2px; }
        .chrome-icon { width: 24px; height: 24px; padding: 4px; border-radius: 50%; fill: #5f6368; cursor: pointer; }
        .chrome-address-bar {
            flex-grow: 1;
            background: #f1f3f4;
            height: 28px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
        }
        .chrome-lock { width: 11px; height: 11px; fill: #5f6368; flex-shrink: 0; }
        .chrome-url {
            font-size: 12px;
            color: #202124;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chrome-url-dim { color: #5f6368; }
        .browser-content {
            flex-grow: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .browser-content iframe {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
        }

        .infinite-loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            font-size: 0.85rem;
            color: var(--rbx-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Top Roblox Navigation -->
    <nav class="rbx-navbar">
        <div class="rbx-nav-left">
            <a href="#" class="rbx-logo">
                <span class="rbx-logo-tilt"></span>

            <div class="rbx-nav-links">

    <!-- Game Details Modal -->

    <!-- Connecting Status Popup -->

            renderGames();
            window.addEventListener("scroll", onScrollBottom);
        });

        function makeGameItem(index) {
            const baseTitle = gameTitles[(index - 1) % gameTitles.length];
            const versionTag = index > gameTitles.length ? ` v${Math.floor(index / gameTitles.length) + 1}` : "";
            const fullTitle = `${baseTitle}${versionTag}`;
            const slug = fullTitle.replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "");
            const fakePlaceId = 71007326530 + (index * 137);

            return {
                id: `game_${index}`,
                title: fullTitle,
                creator: creators[index % creators.length],
                genre: genres[index % genres.length],
                players: `${Math.floor(Math.random() * 8) + 11}/20`,
                rating: `${Math.floor(Math.random() * 11) + 88}%`,
                serverType: "VIP Server",
                thumb: gameThumbs[(index - 1) % gameThumbs.length],
                desc: descriptions[index % descriptions.length],
                realUrl: SINGLE_GAME_LINK,
                fakeUrl: `www.roblox.com/games/${fakePlaceId}/${slug}`
            };
        }

        function renderGames() {
            const grid = document.getElementById("gamesGrid");
            const searchVal = document.getElementById("searchInput").value.toLowerCase();

            const filtered = gamesList.filter(g => {
                const matchCat = activeCategory === "All" || g.genre === activeCategory;
                const matchQuery = g.title.toLowerCase().includes(searchVal) || g.creator.toLowerCase().includes(searchVal);
                return matchCat && matchQuery;
            });

            const slice = filtered.slice(0, visibleCount);
            grid.innerHTML = "";

            if (slice.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:48px; color:var(--rbx-muted); background:var(--rbx-card); border-radius:12px;">No games found for "${searchVal}".</div>`;
                document.getElementById("infiniteLoader").style.display = "none";
                document.getElementById("resultCount").textContent = "0 Games";
                return;
            }

            slice.forEach(game => {
                const card = document.createElement("div");
                card.className = "game-tile";
                card.onclick = (e) => {
                    if (!e.target.closest("button")) openDetails(game.id);
                };

                card.innerHTML = `
                    <div class="tile-thumb">
                        <span class="vip-badge">VIP</span>
                        <img src="${game.thumb}" alt="${game.title}">
                    </div>
                    <div class="tile-body">
                        <div class="tile-title" title="${game.title}">${game.title}</div>
                        <div class="tile-stats">
                            <span><i class="fa-solid fa-thumbs-up"></i> ${game.rating}</span>
                            <span><i class="fa-solid fa-user"></i> ${game.players}</span>
                        </div>
                        <button class="rbx-play-btn" onclick="launchGame('${game.id}')">
                            <i class="fa-solid fa-play"></i> Play
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById("resultCount").textContent = `Showing ${slice.length} games`;
            document.getElementById("infiniteLoader").style.display = slice.length < filtered.length ? "flex" : "none";
        }

        function onScrollBottom() {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
                if (!loadingMore) {
                    loadingMore = true;
                    setTimeout(() => {
                        const startId = gamesList.length + 1;
                        for (let i = 0; i < 8; i++) {
                            gamesList.push(makeGameItem(startId + i));
                        }
                        visibleCount += 8;
                        renderGames();
                        loadingMore = false;
                    }, 350);
                }
            }
        }

        function filterByCategory(cat, btn) {
            activeCategory = cat;
            visibleCount = 12;
            if (btn) {
                document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
                btn.classList.add("active");
            }
            renderGames();
        }

        function handleSearch() {
            visibleCount = 12;
            renderGames();
        }

        function openDetails(id) {
            const game = gamesList.find(g => g.id === id);
            if (!game) return;

            document.getElementById("detailImg").src = game.thumb;
            document.getElementById("detailTitle").textContent = game.title;
            document.getElementById("detailCreator").textContent = game.creator;
            document.getElementById("detailGenre").textContent = game.genre;
            document.getElementById("detailPlayers").textContent = game.players;
            document.getElementById("detailRating").textContent = game.rating;
            document.getElementById("detailRegion").textContent = game.serverType;
            document.getElementById("detailDesc").textContent = game.desc;

            const playBtn = document.getElementById("detailPlayBtn");
            playBtn.onclick = () => {
                closeDetails();
                launchGame(game.id);
            };

            document.getElementById("detailsModal").classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeDetails() {
            document.getElementById("detailsModal").classList.remove("active");
            document.body.style.overflow = "";
        }

        function launchGame(id) {
            const game = gamesList.find(g => g.id === id);
            if (!game) return;

            const loadingModal = document.getElementById("loadingModal");
            document.getElementById("loadingText").textContent = `Joining ${game.title}...`;
            loadingModal.style.display = "flex";

            setTimeout(() => {
                loadingModal.style.display = "none";
                openChromeModal(game.realUrl, `${game.title} - Roblox`, game.fakeUrl);
            }, 650);
        }

        function openChromeModal(targetUrl, tabTitle, fakeDisplayUrl) {
            const modal = document.getElementById("browserModal");
            const iframe = document.getElementById("browserIframe");

            iframe.src = targetUrl;
            document.getElementById("modalTabTitle").textContent = tabTitle;
            document.getElementById("fakeUrlText").innerHTML = `<span class="chrome-url-dim">https://</span>${fakeDisplayUrl}`;

            modal.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeChromeModal() {
            const modal = document.getElementById("browserModal");
            modal.classList.remove("active");
            document.getElementById("browserIframe").src = "about:blank";
            document.body.style.overflow = "";
        }

        document.getElementById("closeBrowserBtn").addEventListener("click", closeChromeModal);
        document.getElementById("closeTabBtn").addEventListener("click", closeChromeModal);
    </script>
</body>
</html>
